<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e8e6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu Cofrinho"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Meu Cofrinho</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff9f7;color:#352c30;margin:0;padding:22px;max-width:600px;margin:auto}h1{font-size:28px}header{display:flex;align-items:center;gap:12px}.pig{font-size:38px}.card{background:white;border:1px solid #f2dddf;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #e9d7d733}.balance{font-size:34px;font-weight:700}.muted{color:#786b71;font-size:14px}.stats{display:flex;gap:12px}.stats .card{flex:1}button{background:#a34f72;color:white;border:0;border-radius:12px;padding:13px;font-weight:650;cursor:pointer}input,select{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 12px;border:1px solid #e6cdd4;border-radius:10px;font-size:16px}label{font-size:14px}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;border-bottom:1px solid #f1e6e7;padding:12px 0;gap:8px}small{color:#75676c}.positive{color:#278362}.negative{color:#bd4961}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#eee0e5;color:#613a4d}</style></head><body><header><span class="pig">🐷</span><div><h1>Meu Cofrinho</h1><div class="muted">Pequenos passos, grandes conquistas.</div></div></header><section class="card"><div class="muted">Saldo registrado</div><div class="balance" id="balance">R$ 0,00</div></section><div class="stats"><section class="card"><div class="muted">Entradas</div><strong class="positive" id="income">R$ 0,00</strong></section><section class="card"><div class="muted">Saídas</div><strong class="negative" id="expense">R$ 0,00</strong></section></div><section class="card"><h2>Novo lançamento</h2><form id="form"><label>Descrição<input id="description" required maxlength="90" placeholder="Ex.: Mercado"></label><label>Valor (R$)<input id="amount" type="number" min="0.01" step="0.01" required placeholder="0,00"></label><label>Tipo<select id="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></label><label>Categoria<select id="category"><option>Alimentação</option><option>Casa</option><option>Transporte</option><option>Saúde</option><option>Lazer</option><option>Trabalho</option><option>Outros</option></select></label><button type="submit">Salvar lançamento</button></form></section><section class="card"><h2>Minha meta</h2><label>Nome da meta<input id="goalName" placeholder="Ex.: Nossa casa"></label><label>Valor desejado (R$)<input id="goalTarget" type="number" min="0" step="0.01"></label><label>Já guardado (R$)<input id="goalSaved" type="number" min="0" step="0.01"></label><button id="saveGoal">Salvar meta</button><p id="goalStatus" class="muted"></p></section><section class="card"><h2>Movimentações</h2><ul id="transactions"></ul><div class="actions"><button class="secondary" id="export">Exportar backup</button><label class="secondary" style="padding:13px;border-radius:12px;cursor:pointer">Importar backup<input id="import" type="file" accept="application/json" style="display:none"></label></div></section><p class="muted">Seus dados ficam neste navegador. Faça backups regularmente: apagar os dados do Safari pode apagar seus registros.</p><script src="app.js"></script></body></html>
